name: 'Build macOS, iOS and Android'

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: hosted-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ─── Lint & Test ─────────────────────────────────────────────────
  check:
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: hotline-tauri/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: hotline-tauri/src-tauri
          key: ${{ github.job }}

      - name: Install frontend dependencies
        working-directory: hotline-tauri
        run: npm ci

      - name: TypeScript typecheck
        working-directory: hotline-tauri
        run: npm run typecheck

      - name: ESLint
        working-directory: hotline-tauri
        run: npm run lint

      - name: Vitest
        working-directory: hotline-tauri
        run: npm test

      - name: Cargo clippy
        working-directory: hotline-tauri/src-tauri
        run: cargo clippy --locked

      - name: Cargo test
        working-directory: hotline-tauri/src-tauri
        run: cargo test --locked

  # ─── macOS Universal Binary ────────────────────────────────────────
  build-macos:
    needs: check
    runs-on: macos-15
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: hotline-tauri/package-lock.json

      - name: Add macOS Rust targets
        run: rustup target add x86_64-apple-darwin aarch64-apple-darwin

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: hotline-tauri/src-tauri
          key: ${{ github.job }}

      - name: Install frontend dependencies
        working-directory: hotline-tauri
        run: npm ci

      - name: Import Apple certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          # Create temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          # Import certificate + private key
          security import certificate.p12 \
            -k build.keychain \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          # Allow codesign to use the private key without GUI prompt
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain
          # Add build.keychain to the search list ALONGSIDE login.keychain
          # (don't replace — codesign needs login.keychain to find the Apple
          # intermediate CA certificates for chain validation)
          security list-keychains -d user -s build.keychain $(security list-keychains -d user | tr -d '"')
          security default-keychain -s build.keychain
          rm certificate.p12
          # Verify identity is accessible
          security find-identity -v -p codesigning build.keychain

      - name: Build macOS universal binary (signed + notarized)
        working-directory: hotline-tauri
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npx tauri build --target universal-apple-darwin -- --locked

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hotline-navigator-macOS-universal
          path: |
            hotline-tauri/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            hotline-tauri/src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app
            hotline-tauri/src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
          retention-days: 7
          if-no-files-found: error

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            hotline-tauri/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            hotline-tauri/src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup keychain
        if: always()
        run: security delete-keychain build.keychain 2>/dev/null || true

  # ─── iOS / iPadOS (Unsigned) ───────────────────────────────────────
  build-ios:
    needs: check
    runs-on: macos-15
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: hotline-tauri/package-lock.json

      - name: Add iOS Rust target
        run: rustup target add aarch64-apple-ios

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: hotline-tauri/src-tauri
          key: ${{ github.job }}

      - name: Install frontend dependencies
        working-directory: hotline-tauri
        run: npm ci

      - name: Disable iOS signing for sideload archive
        run: |
          printf 'CODE_SIGNING_ALLOWED = NO\nCODE_SIGNING_REQUIRED = NO\nCODE_SIGN_IDENTITY =\n' > "$RUNNER_TEMP/unsigned.xcconfig"
          echo "XCODE_XCCONFIG_FILE=$RUNNER_TEMP/unsigned.xcconfig" >> "$GITHUB_ENV"

      - name: Build iOS app (unsigned archive, for sideloading)
        working-directory: hotline-tauri
        # `tauri ios build --export-method debugging` fails at export because
        # we have no Apple account/profile configured. Instead we catch the
        # expected export failure and package the .app directly from the
        # archive into a sideload-ready IPA.
        run: |
          # Export requires a provisioning profile; archive validation below
          # must still fail the job if compilation did not produce a real app.
          npx tauri ios build --ci --export-method debugging || echo "Checking unsigned archive after export failure"

      - name: Package unsigned IPA from archive
        run: |
          # Find the .xcarchive produced by tauri ios build
          ARCHIVE=$(find hotline-tauri/src-tauri/gen/apple/build -name "*.xcarchive" -type d | head -1)
          if [ -z "$ARCHIVE" ]; then
            echo "Error: No .xcarchive found"
            find hotline-tauri/src-tauri/gen/apple/build -maxdepth 3 -type d
            exit 1
          fi
          echo "Found archive at: $ARCHIVE"
          APP_PATH="$ARCHIVE/Products/Applications"
          APP=$(find "$APP_PATH" -name "*.app" -type d -maxdepth 1 | head -1)
          if [ -z "$APP" ]; then
            echo "Error: No .app inside archive"
            exit 1
          fi
          echo "Found app at: $APP"
          EXECUTABLE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")
          test -s "$APP/$EXECUTABLE"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qr hotline-navigator-unsigned.ipa Payload
          rm -rf Payload
          ls -lh hotline-navigator-unsigned.ipa

      - name: Upload iOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hotline-navigator-iOS-unsigned
          path: hotline-navigator-unsigned.ipa
          retention-days: 7
          if-no-files-found: error

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: hotline-navigator-unsigned.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─── Android (unsigned APK for sideloading) ────────────────────────
  build-android:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: hotline-tauri/package-lock.json

      - name: Add Android Rust targets
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: hotline-tauri/src-tauri
          key: ${{ github.job }}

      - name: Install frontend dependencies
        working-directory: hotline-tauri
        run: npm ci

      - name: Generate sideload signing keystore
        run: |
          keytool -genkey -v \
            -keystore hotline-tauri/src-tauri/gen/android/keystore.jks \
            -alias hotline -keyalg RSA -keysize 2048 \
            -validity 10000 -storepass hotline123 -keypass hotline123 \
            -dname "CN=Hotline Navigator,O=Greg Gant,C=US"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Build Android APK
        working-directory: hotline-tauri
        run: npx tauri android build --ci --apk true --aab false

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hotline-navigator-Android-universal
          path: |
            hotline-tauri/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          retention-days: 7
          if-no-files-found: error

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            hotline-tauri/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
